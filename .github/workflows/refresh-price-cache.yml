name: Refresh public price cache

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-price-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build validated ZRep and Phone-Parts snapshots
        run: node scripts/refresh-public-price-cache.js

      - name: Publish changed snapshots
        shell: bash
        run: |
          if git diff --quiet -- price-cache; then
            echo "Price snapshots are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-cache/zrep.json price-cache/phoneparts.json
          git commit -m "chore: refresh public price cache"
          git push
